[tool.ruff]
required-version = "==0.17.0"
target-version = "py37"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
no_site_packages = true
warn_unused_ignores = true
