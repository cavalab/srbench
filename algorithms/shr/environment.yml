name: shr
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=1.26.4
  - pandas
  - scipy
  - scikit-learn
  - sympy=1.14.0
  - psutil
  - pip
  - pip:
      # pyoperon is published on PyPI (not on conda-forge).
      - pyoperon==0.6.1
      # CPU torch is sufficient (the MLP falls back to CPU when no GPU is
      # available); swap in the matching CUDA build if the build host has a GPU.
      - torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu
