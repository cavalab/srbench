name: brush
channels:
    - conda-forge
dependencies:
    - python=3.12.0
    - cmake=4.0.3
    - eigen=3.4.0
    - fmt=11.1.4
    - c-compiler=1.9.0
    - cxx-compiler=1.9.0
    - clang=18.1.8
    - clangxx=18.1.8
    - ninja=1.12.1
    - ceres-solver=2.1.0
    - glog=0.6.0
    - gflags=2.2.2
    # - boost-cpp=1.78.0
    # - libboost-devel
    - pybind11=2.13.6
    - taskflow=3.10.0
    - pytest=7.4.3
    - pydot=1.4.2
    - scikit-learn=1.3.2
    - scikit-build-core
    - pandas=2.1.3
    # not required to install the c++ library (but used in the wrapper)
    - jupyter
    - ipython
    - pip
    - nlohmann_json=3.12.0
    - pybind11_json=0.2.15
    # Building documentation
    - doxygen
    - sphinx=7.2.6
    - pip:
      - graphviz
      # - deap # optional
      # - pmlb # used only for testing
