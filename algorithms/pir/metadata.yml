# PIR — Physics Intermediate Representation
name: PIR
authors:
  - name: Qazi Hanif
    email: qmhanif70@gmail.com
email: qmhanif70@gmail.com
url: https://github.com/Qazi-pk/physics-engine
key: PIR
paper:
  title: "PIR: Physics Intermediate Representation for Automated Discovery of Physical Laws"
  url: https://doi.org/10.5281/zenodo.21351039
description: >
  Classical symbolic regression (no neural components): monomial-basis search
  with log-linearization power-law detection, pairwise structure decomposition,
  RANSAC, sparse regression, and iterative residual refinement with an Occam
  complexity penalty. Since pir-engine 3.6.0, fallback gates run after the
  engine when its model is not exact: an exact rational-function gate (P/Q),
  an exact exponential gate, and a noise-tolerant power-law gate with exponents
  snapped to simple fractions. Software DOI: 10.5281/zenodo.23460311.
