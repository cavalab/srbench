# PIR — Physics Intermediate Representation
name: PIR
authors:
  - name: Qazi Hanif
    email: qmhanif70@gmail.com
email: qmhanif70@gmail.com
url: https://github.com/Qazi-pk/physics-engine
key: PIR
paper:
  title: "PIR: Physics Intermediate Representation for Automated Discovery of Physical Laws"
  url: https://doi.org/10.5281/zenodo.21351039
description: >
  Classical symbolic regression (no neural components): monomial-basis search
  with log-linearization power-law detection, pairwise structure decomposition,
  RANSAC, sparse regression, and iterative residual refinement with an Occam
  complexity penalty. Since pir-engine 3.6.0, fallback gates run after the
  engine when its model is not exact: an exact rational-function gate (P/Q),
  an exact exponential gate, and a noise-tolerant power-law gate with exponents
  snapped to simple fractions. Since 3.7.0, a safeguard returns a ridge-linear
  model (or the mean) instead when the formula fits clearly worse than that
  baseline under cross-validation. Since 3.8.0, a deterministic separability
  stage tests whether y = g(A)*h(B) for a split of the inputs, solves the
  parts separately and accepts their product only if it is exact. Since 3.9.0
  it also handles sign-changing targets and root and sin/cos factors.
  Since 3.10.0, a noise-tolerant stage (at least 2,000 training rows, only
  when nothing is exact) fits separable, exponential and rational forms,
  snaps exponents and coefficient ratios to simple fractions within their
  standard errors, and accepts a form only if it predicts held-out rows as
  well as a flexible reference model.
  Software DOI: 10.5281/zenodo.24156912.
