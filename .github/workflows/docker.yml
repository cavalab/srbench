name: Docker Images

on:
  push:
    branches:
      - dev
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  ORG: ${{ secrets.DOCKER_HUB_USERNAME }}

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A dev push gets the development tag. A vX.Y tag is a release: publish
      # its numeric version and promote it to latest.
      - name: Select image tags
        id: image_tags
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ -z "$version" || "$version" == "$GITHUB_REF_NAME" ]]; then
              echo "Release tags must use the v<version> form (for example v0.1)." >&2
              exit 1
            fi
            echo "base_tag=$version" >> "$GITHUB_OUTPUT"
            {
              echo "tags<<EOF"
              echo "${ORG}/base:latest"
              echo "${ORG}/base:${version}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_REF_NAME" != "dev" ]]; then
              echo "Development images may only be published from the dev branch." >&2
              exit 1
            fi
            echo "base_tag=dev" >> "$GITHUB_OUTPUT"
            {
              echo "tags<<EOF"
              echo "${ORG}/base:dev"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: baseDockerfile
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

  algorithms:
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        algorithm:
          - afp
          - bingo
          - brush
          - bsr
          - e2et
          - eplex
          - eql
          - feat
          - ffx
          - geneticengine
          - gpgomea
          - gplearn
          - gpzgd
          - itea
          - lightgbm
          - nesymres
          - operon
          - pantara
          - ps-tree
          - pysr
          - qlattice
          - rils-rols
          - sklearn
          - tir
          - tpsr
          - udsr
          - xgboost
    steps:
      - uses: actions/checkout@v4
      - name: Select image tags
        id: image_tags
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ -z "$version" || "$version" == "$GITHUB_REF_NAME" ]]; then
              echo "Release tags must use the v<version> form (for example v0.1)." >&2
              exit 1
            fi
            echo "base_tag=$version" >> "$GITHUB_OUTPUT"
            {
              echo "tags<<EOF"
              echo "${ORG}/${{ matrix.algorithm }}:latest"
              echo "${ORG}/${{ matrix.algorithm }}:${version}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_REF_NAME" != "dev" ]]; then
              echo "Development images may only be published from the dev branch." >&2
              exit 1
            fi
            echo "base_tag=dev" >> "$GITHUB_OUTPUT"
            {
              echo "tags<<EOF"
              echo "${ORG}/${{ matrix.algorithm }}:dev"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Resolve Dockerfile
        id: dockerfile
        run: |
          if [ -f "algorithms/${{ matrix.algorithm }}/Dockerfile" ]; then
            echo "path=algorithms/${{ matrix.algorithm }}/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=alg-Dockerfile" >> $GITHUB_OUTPUT
          fi
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          build-args: |
            ALGORITHM=${{ matrix.algorithm }}
            BASE_IMAGE=${{ env.ORG }}/base:${{ steps.image_tags.outputs.base_tag }}
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.algorithm }}
          cache-to: type=gha,scope=${{ matrix.algorithm }},mode=max
