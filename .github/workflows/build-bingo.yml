name: Build Bingo Docker Image

on:
  workflow_dispatch:  # manual trigger
  push:
    paths:
      - 'algorithms/bingo/**'
      - 'Dockerfile.bingo'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.bingo
          push: true
          tags: your-dockerhub-username/srbench-bingo:latest
          build-args: |
            ALGORITHM=bingo
```

Then:
1. Push this to your GitHub repo
2. Add `DOCKERHUB_USERNAME` and `DOCKERHUB_TOKEN` secrets in repo settings
3. Trigger the workflow manually from the Actions tab
4. Pull on the cluster with `apptainer pull ... docker://your-dockerhub-username/srbench-bingo:latest`

---

## Option C: Use a cloud VM (AWS/GCP/Azure)

Spin up a cheap VM with Docker, build there, push to Docker Hub, then pull on the cluster.

---

**Which option fits your setup?** If you have Docker on your Windows machine, Option A is fastest. If you want automation, Option B (GitHub Actions) is best.