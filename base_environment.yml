channels:
  - conda-forge
  - defaults
dependencies:
  # pyarrow does not yet publish Conda packages for Python 3.15.
  # Keep the shared image on the supported version recorded in the lock file.
  - python=3.12
  - scikit-learn 
  - pandas 
  - numpy
  - pyarrow
  - pytest
  - sympy
  - pyyaml
  - pip 
  - pip:
    - git+https://github.com/EpistasisLab/pmlb # mislabeled datasets fixed
    - pytest-order
