channels:
  - conda-forge
  - defaults
dependencies:
  # pyarrow does not yet publish Conda packages for Python 3.15.  Keep this
  # as a ceiling so method-specific environment files can select their own
  # compatible Python version (for example, FFX needs 3.11.10).
  - python<3.15
  - scikit-learn 
  - pandas 
  - numpy
  - pyarrow
  - pytest
  - sympy
  - pyyaml
  - pip 
  - pip:
    - git+https://github.com/EpistasisLab/pmlb # mislabeled datasets fixed
    - pytest-order
