default_language_version:
  python: python3
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy (all Python sources)
        entry: python scripts/typecheck.py
        language: python
        additional_dependencies: [mypy==2.4.0]
        pass_filenames: false
        always_run: true
